<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điều kiện điều khoản – 
  <link rel="icon" href="data:,">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap');

    :root {
      --pink: #ff1f8e;
      --pink-deep: #d4006e;
      --pink-cream: #fff0f7;
      --navy: #0d1b3e;
      --navy-light: #1a2d5a;
      --white: #ffffff;
      --gray: #f5f6fa;
      --text: #2d2d2d;
      --text-light: #6b7280;
      --border: #e5e7eb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--text);
      background: var(--white);
    }

    /* HEADER */
    header {
      background: var(--navy);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    .logo a {
      text-decoration: none;
      font-size: 22px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--pink); }

    nav ul {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    nav a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--pink); }

    /* HERO BANNER */
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 60%, #2d1060 100%);
      padding: 60px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,31,142,0.15) 0%, transparent 70%);
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -60px;
      width: 250px; height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,31,142,0.1) 0%, transparent 70%);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }

    .breadcrumb a { color: rgba(255,255,255,0.5); text-decoration: none; }
    .breadcrumb a:hover { color: var(--pink); }
    .breadcrumb span { color: var(--pink); font-weight: 600; }

    .hero h1 {
      font-size: 38px;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--pink);
    }

    .hero p {
      color: rgba(255,255,255,0.65);
      font-size: 15px;
      position: relative;
      z-index: 1;
    }

    /* LAYOUT */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 40px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 40px;
      align-items: start;
    }

    /* SIDEBAR */
    .sidebar {
      position: sticky;
      top: 80px;
      background: var(--gray);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    .sidebar h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-light);
      margin-bottom: 16px;
    }

    .sidebar ul { list-style: none; }

    .sidebar ul li { margin-bottom: 4px; }

    .sidebar ul li a {
      display: block;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s;
      line-height: 1.4;
    }

    .sidebar ul li a:hover {
      background: var(--pink-cream);
      color: var(--pink);
    }

    .sidebar ul li a.active {
      background: var(--pink);
      color: var(--white);
    }

    /* CONTENT */
    .content { min-width: 0; }

    .section-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      margin-bottom: 24px;
      transition: box-shadow 0.2s;
    }

    .section-card:hover {
      box-shadow: 0 8px 32px rgba(255,31,142,0.08);
    }

    .section-tag {
      display: inline-block;
      background: var(--pink-cream);
      color: var(--pink);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .section-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-card h2 .icon {
      width: 36px; height: 36px;
      background: var(--pink-cream);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .section-card p {
      font-size: 14px;
      line-height: 1.8;
      color: #4b5563;
      margin-bottom: 12px;
    }

    .section-card p:last-child { margin-bottom: 0; }

    .term-list {
      list-style: none;
      margin-top: 12px;
    }

    .term-list li {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: #4b5563;
      line-height: 1.6;
    }

    .term-list li:last-child { border-bottom: none; }

    .term-list li::before {
      content: '✦';
      color: var(--pink);
      font-size: 10px;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .highlight-box {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      border-radius: 16px;
      padding: 24px;
      margin-top: 16px;
    }

    .highlight-box p {
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      margin-bottom: 0;
    }

    .highlight-box strong { color: var(--pink); }

    .updated-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #059669;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .updated-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #059669;
    }

    /* FOOTER */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.6);
      text-align: center;
      padding: 32px 40px;
      font-size: 13px;
      margin-top: 40px;
    }

    footer strong { color: var(--pink); }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; padding: 24px 20px; }
      .sidebar { position: static; }
      .hero { padding: 40px 20px; }
      .hero h1 { font-size: 26px; }
      header { padding: 0 20px; }
      nav { display: none; }
    }
  </style>
</head>

<script>
  // Highlight sidebar khi scroll
  const sections = document.querySelectorAll('.section-card');
  const links = document.querySelectorAll('.sidebar a');

  window.addEventListener('scroll', () => {
    let current = '';
    sections.forEach(section => {
      if (window.scrollY >= section.offsetTop - 100) {
        current = section.getAttribute('id');
      }
    });
    links.forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('href') === '#' + current) {
        link.classList.add('active');
      }
    });
  });
</script>
